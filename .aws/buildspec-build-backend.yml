version: 0.2
# Stage: Build Backend
# Docker build de la imagen del backend y push a ECR.
# Variables inyectadas por CodeBuild: ECR_REPOSITORY_URI

phases:
  pre_build:
    commands:
      - export IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-$CODEBUILD_BUILD_NUMBER}" | cut -c1-12)
      - export ECR_REGISTRY=$(echo $ECR_REPOSITORY_URI | cut -d/ -f1)
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - echo "IMAGE_TAG=$IMAGE_TAG  ECR=$ECR_REPOSITORY_URI"

  build:
    commands:
      - |
        cd datavault/backend
        docker build -f Dockerfile.prod \
          -t $ECR_REPOSITORY_URI:$IMAGE_TAG \
          -t $ECR_REPOSITORY_URI:latest .
      - docker push $ECR_REPOSITORY_URI --all-tags

  post_build:
    commands:
      - echo "Push completo → $ECR_REPOSITORY_URI:$IMAGE_TAG"

artifacts:
  files:
    - '**/*'
