version: 0.2
# Stage: Build Frontend
# npm build + S3 sync + CloudFront invalidation.
# Variables inyectadas por CodeBuild: FRONTEND_BUCKET, CLOUDFRONT_DIST_ID,
#                                     VITE_API_URL, VITE_WS_URL

phases:
  install:
    runtime-versions:
      nodejs: 20

  build:
    commands:
      - cd datavault/frontend
      - npm ci
      - npm run build
      - aws s3 sync dist/ s3://$FRONTEND_BUCKET --delete
      - echo "Frontend sincronizado a s3://$FRONTEND_BUCKET"

  post_build:
    commands:
      - |
        aws cloudfront create-invalidation \
          --distribution-id $CLOUDFRONT_DIST_ID \
          --paths "/*"
      - echo "CloudFront invalidado → $CLOUDFRONT_DIST_ID"
