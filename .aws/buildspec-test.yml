version: 0.2
# Equivalente al job 'build' de .github/workflows/ci-cd.yml
# Corre pytest + flake8 sobre el backend.

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install flake8 pytest
      - pip install -r datavault/backend/requirements.txt

  build:
    commands:
      - flake8 datavault/backend --count --select=E9,F63,F7,F82 --show-source --statistics
      - flake8 datavault/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - cd datavault/backend && python -m pytest tests/ -v --tb=short

# Pasar el código fuente completo al siguiente stage (Build)
artifacts:
  files:
    - '**/*'
