version: 0.2
# Equivalente a los jobs 'deploy-staging' / 'deploy-production' de
# .github/workflows/ci-cd.yml. Las variables de entorno las inyecta
# el proyecto CodeBuild definido en terraform/codepipeline.tf.
#
# Variables requeridas (configuradas en Terraform):
#   ECR_REPOSITORY_URI  — URL completa del repo ECR
#   ECS_CLUSTER         — nombre del cluster ECS
#   ECS_SERVICE         — nombre del servicio ECS
#   TASK_DEF_FAMILY     — familia de la task definition
#   FRONTEND_BUCKET     — nombre del bucket S3 del frontend
#   CLOUDFRONT_DIST_ID  — ID de la distribución CloudFront
#   VITE_API_URL        — URL pública de la API (https://...)
#   VITE_WS_URL         — URL pública del WebSocket (wss://...)

phases:
  pre_build:
    commands:
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}
      - ECR_REGISTRY=$(echo $ECR_REPOSITORY_URI | cut -d/ -f1)
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      # ── Backend: Docker build + push ECR ─────────────────────────────────
      - cd datavault/backend
      - |
        docker build -f Dockerfile.prod \
          -t $ECR_REPOSITORY_URI:$IMAGE_TAG \
          -t $ECR_REPOSITORY_URI:latest .
      - docker push $ECR_REPOSITORY_URI --all-tags
      - cd ../..

      # ── Frontend: npm build + S3 sync + CloudFront invalidate ─────────────
      - cd datavault/frontend
      - npm ci
      - npm run build
      - aws s3 sync dist/ s3://$FRONTEND_BUCKET --delete
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"
      - cd ../..

  post_build:
    commands:
      # ── Alembic: registrar nueva task def y correr migración ──────────────
      - |
        CURRENT_TASK=$(aws ecs describe-task-definition \
          --task-definition $TASK_DEF_FAMILY --query 'taskDefinition' --output json)

        NEW_TASK=$(echo "$CURRENT_TASK" | jq \
          --arg IMG "$ECR_REPOSITORY_URI:$IMAGE_TAG" \
          --arg CTR "backend" \
          '(.containerDefinitions[] | select(.name==$CTR) | .image) |= $IMG |
           del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
               .compatibilities,.registeredAt,.registeredBy,.enableFaultInjection)')

        NEW_TASK_ARN=$(aws ecs register-task-definition \
          --cli-input-json "$NEW_TASK" \
          --query 'taskDefinition.taskDefinitionArn' --output text)

        NET_CFG=$(aws ecs describe-services \
          --cluster $ECS_CLUSTER --services $ECS_SERVICE \
          --query 'services[0].networkConfiguration' --output json)

        TASK_ARN=$(aws ecs run-task \
          --cluster $ECS_CLUSTER \
          --task-definition $NEW_TASK_ARN \
          --launch-type FARGATE \
          --network-configuration "$NET_CFG" \
          --overrides "{\"containerOverrides\":[{\"name\":\"backend\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
          --query 'tasks[0].taskArn' --output text)

        aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN

        EXIT=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN \
          --query 'tasks[0].containers[0].exitCode' --output text)
        [ "$EXIT" = "0" ] || { echo "Migracion fallo (exit $EXIT)"; exit 1; }
        echo "Migracion OK."

      # ── ECS: forzar nuevo deployment con la imagen recién subida ──────────
      - |
        LATEST=$(aws ecs describe-task-definition \
          --task-definition $TASK_DEF_FAMILY \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --task-definition $LATEST \
          --force-new-deployment
        echo "Deploy iniciado."
