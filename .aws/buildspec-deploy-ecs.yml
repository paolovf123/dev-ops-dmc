version: 0.2
# Stage: Deploy ECS
# Fuerza nuevo deployment en ECS Fargate con la imagen ya migrada.
# Variables inyectadas: ECS_CLUSTER, ECS_SERVICE, TASK_DEF_FAMILY

phases:
  build:
    commands:
      - |
        LATEST=$(aws ecs describe-task-definition \
          --task-definition $TASK_DEF_FAMILY \
          --query 'taskDefinition.taskDefinitionArn' --output text)

        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --task-definition $LATEST \
          --force-new-deployment

        echo "Deploy iniciado en $ECS_CLUSTER/$ECS_SERVICE — esperando estabilidad..."
        aws ecs wait services-stable \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE
        echo "Servicio estable."
