<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Cubo isométrico Cubo. Sin fondo. -->
  <!-- Cara superior (azul medio) -->
  <path d="M32 6 L56 19 L32 32 L8 19 Z" fill="#5B7AB8"/>
  <!-- Cara izquierda (azul claro) -->
  <path d="M8 19 L32 32 L32 58 L8 45 Z" fill="#3D6BA8"/>
  <!-- Cara derecha (azul marino oscuro) -->
  <path d="M56 19 L32 32 L32 58 L56 45 Z" fill="#1E3A66"/>
  <!-- Cubo interior superpuesto (efecto voxel) -->
  <path d="M32 19 L44 25.5 L32 32 L20 25.5 Z" fill="#7B95C9"/>
  <path d="M20 25.5 L32 32 L32 45 L20 38.5 Z" fill="#4F78B5"/>
  <path d="M44 25.5 L32 32 L32 45 L44 38.5 Z" fill="#2B4A78"/>
  <!-- Aristas blancas -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" fill="none">
    <path d="M32 6 L56 19 L32 32 L8 19 Z"/>
    <path d="M8 19 L32 32 L32 58 L8 45 Z"/>
    <path d="M56 19 L32 32 L32 58 L56 45 Z"/>
    <path d="M32 19 L44 25.5 L32 32 L20 25.5 Z"/>
    <path d="M20 25.5 L32 32 L32 45"/>
    <path d="M44 25.5 L32 32 L32 45"/>
  </g>
</svg>
