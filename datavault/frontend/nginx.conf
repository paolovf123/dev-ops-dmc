server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca se cachea — el browser lo re-descarga en cada deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    location / {
        # SPA fallback: si no encuentra el archivo, sirve index.html
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS con hash en nombre → immutable (Vite los hashea en build)
    location ~* \.(js|css)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Resto de estáticos (imágenes, fuentes, iconos)
    location ~* \.(ico|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000";
    }
}
