<!doctype html>
<html lang="es" data-palette="citrus" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cubo · OpsGrid — gestor de datos tabulares" />
    <title>Cubo</title>
    <script>
      // OpsGrid theme bootstrap — aplica dark/light antes del primer paint (sin flash)
      (function () {
        try {
          var t = localStorage.getItem('opsgrid-theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
