name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Tests y lint (siempre)
  # ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest
          pip install -r datavault/backend/requirements.txt

      - name: Lint
        run: |
          flake8 datavault/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 datavault/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Tests
        working-directory: datavault/backend
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────
  # 2. Deploy Staging (push → develop)
  # ─────────────────────────────────────────────────────────
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    permissions:
      id-token: write
      contents: read

    env:
      ENVIRONMENT: staging
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: datavault-backend-staging
      ECS_CLUSTER: datavault-staging
      ECS_SERVICE: datavault-backend
      TASK_DEF_FAMILY: datavault-backend-staging
      CONTAINER_NAME: backend

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd datavault/backend
          docker build -f Dockerfile.prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & sync frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          cd datavault/frontend
          npm ci
          npm run build

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="datavault-frontend-${ENVIRONMENT}-${ACCOUNT_ID}"
          aws s3 sync dist/ s3://$BUCKET --delete

          # Invalidar CloudFront usando el ID de la distribución directamente
          DIST_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -n "$DIST_ID" ]; then
            echo "Invalidando CloudFront $DIST_ID..."
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi

      - name: Migrar base de datos (Alembic)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Registrar nueva task definition con la imagen recién construida
          CURRENT_TASK=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FAMILY --query 'taskDefinition' --output json)

          NEW_TASK=$(echo "$CURRENT_TASK" | jq \
            --arg IMG "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg CTR "$CONTAINER_NAME" \
            '(.containerDefinitions[] | select(.name==$CTR) | .image) |= $IMG |
             del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                 .compatibilities,.registeredAt,.registeredBy,.enableFaultInjection)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Task registrada: $NEW_TASK_ARN"

          NET_CFG=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $NEW_TASK_ARN \
            --launch-type FARGATE \
            --network-configuration "$NET_CFG" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Esperando migración $TASK_ARN..."
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN

          EXIT=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT" = "0" ] || { echo "Migración falló (exit $EXIT)"; exit 1; }
          echo "Migración OK."

      - name: Deploy ECS
        run: |
          LATEST=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FAMILY \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $LATEST \
            --force-new-deployment
          echo "Deploy iniciado. Sigue el progreso en la consola de ECS."

  # ─────────────────────────────────────────────────────────
  # 3. Deploy Production (push → main)
  # ─────────────────────────────────────────────────────────
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read

    env:
      ENVIRONMENT: prod
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: datavault-backend-prod
      ECS_CLUSTER: datavault-prod
      ECS_SERVICE: datavault-backend
      TASK_DEF_FAMILY: datavault-backend-prod
      CONTAINER_NAME: backend

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd datavault/backend
          docker build -f Dockerfile.prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & sync frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          cd datavault/frontend
          npm ci
          npm run build

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="datavault-frontend-${ENVIRONMENT}-${ACCOUNT_ID}"
          aws s3 sync dist/ s3://$BUCKET --delete

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='${BUCKET}.s3.amazonaws.com'].Id | [0]" \
            --output text)
          if [ "$DIST_ID" != "None" ] && [ -n "$DIST_ID" ]; then
            echo "Invalidando CloudFront $DIST_ID..."
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi

      - name: Migrar base de datos (Alembic)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          CURRENT_TASK=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FAMILY --query 'taskDefinition' --output json)

          NEW_TASK=$(echo "$CURRENT_TASK" | jq \
            --arg IMG "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg CTR "$CONTAINER_NAME" \
            '(.containerDefinitions[] | select(.name==$CTR) | .image) |= $IMG |
             del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                 .compatibilities,.registeredAt,.registeredBy,.enableFaultInjection)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          NET_CFG=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $NEW_TASK_ARN \
            --launch-type FARGATE \
            --network-configuration "$NET_CFG" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN

          EXIT=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT" = "0" ] || { echo "Migración falló (exit $EXIT)"; exit 1; }
          echo "Migración OK."

      - name: Deploy ECS
        run: |
          LATEST=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FAMILY \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $LATEST \
            --force-new-deployment
