name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r datavault/backend/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 datavault/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 datavault/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        working-directory: datavault/backend
        run: python -m pytest tests/ -v --tb=short

      - name: Build check
        run: |
          echo "Build completed successfully"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Backend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: datavault-backend-staging
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd datavault/backend
          docker build -f Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Sync Frontend to S3
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          cd datavault/frontend
          npm ci
          npm run build

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="datavault-frontend-staging-${ACCOUNT_ID}"

          echo "Sincronizando con S3: $BUCKET_NAME"
          aws s3 sync dist/ s3://$BUCKET_NAME --delete

          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items==null && starts_with(Origins.Items[0].DomainName, '$BUCKET_NAME')].Id | [0]" --output text)
          if [ "$DIST_ID" != "None" ] && [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi

      - name: Register new Task Definition and Run Alembic Migrations
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: datavault-backend-staging
          IMAGE_TAG: ${{ github.sha }}
        run: |
          CLUSTER="datavault-staging"
          CONTAINER="backend"
          TASK_DEF_FAMILY="datavault-backend-staging"

          # Fetch the current task definition and update the image to the just-built one
          TASK_DEF_JSON=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FAMILY \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF_JSON" | jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg CONTAINER "$CONTAINER" \
            '(.containerDefinitions[] | select(.name == $CONTAINER) | .image) |= $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Nueva task definition registrada: $NEW_TASK_DEF_ARN"

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $CLUSTER --services datavault-backend \
            --query 'services[0].networkConfiguration' --output json)

          echo "Ejecutando migraciones en cluster $CLUSTER..."
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --task-definition $NEW_TASK_DEF_ARN \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "{\"containerOverrides\": [{\"name\": \"$CONTAINER\", \"command\": [\"alembic\", \"upgrade\", \"head\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Esperando a que la tarea $TASK_ARN finalice..."
          aws ecs wait tasks-stopped --cluster $CLUSTER --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks --cluster $CLUSTER --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Error: La migración falló (Exit code: $EXIT_CODE)"
            exit 1
          fi
          echo "Migración exitosa."

      - name: Deploy new ECS revision
        run: |
          LATEST_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition datavault-backend-staging \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster datavault-staging \
            --service datavault-backend \
            --task-definition $LATEST_TASK_DEF \
            --force-new-deployment

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Backend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: datavault-backend-prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd datavault/backend
          docker build -f Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Sync Frontend to S3
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          cd datavault/frontend
          npm ci
          npm run build

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="datavault-frontend-prod-${ACCOUNT_ID}"

          echo "Sincronizando con S3: $BUCKET_NAME"
          aws s3 sync dist/ s3://$BUCKET_NAME --delete

          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items==null && starts_with(Origins.Items[0].DomainName, '$BUCKET_NAME')].Id | [0]" --output text)
          if [ "$DIST_ID" != "None" ] && [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi

      - name: Register new Task Definition and Run Alembic Migrations
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: datavault-backend-prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          CLUSTER="datavault-prod"
          CONTAINER="backend"
          TASK_DEF_FAMILY="datavault-backend-prod"

          TASK_DEF_JSON=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FAMILY \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF_JSON" | jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --arg CONTAINER "$CONTAINER" \
            '(.containerDefinitions[] | select(.name == $CONTAINER) | .image) |= $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Nueva task definition registrada: $NEW_TASK_DEF_ARN"

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $CLUSTER --services datavault-backend \
            --query 'services[0].networkConfiguration' --output json)

          echo "Ejecutando migraciones en cluster $CLUSTER..."
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --task-definition $NEW_TASK_DEF_ARN \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "{\"containerOverrides\": [{\"name\": \"$CONTAINER\", \"command\": [\"alembic\", \"upgrade\", \"head\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Esperando a que la tarea $TASK_ARN finalice..."
          aws ecs wait tasks-stopped --cluster $CLUSTER --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks --cluster $CLUSTER --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Error: La migración falló (Exit code: $EXIT_CODE)"
            exit 1
          fi
          echo "Migración exitosa."

      - name: Deploy new ECS revision
        run: |
          LATEST_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition datavault-backend-prod \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster datavault-prod \
            --service datavault-backend \
            --task-definition $LATEST_TASK_DEF \
            --force-new-deployment
